<style>
  .nrg-found { margin: 0 0 16px; }
  .nrg-found button { display: block; width: 100%; margin-bottom: 8px; text-align: left; }
  .nrg-muted { color: var(--homey-color-mono-500, #888); font-size: 14px; }
  .nrg-error { color: var(--homey-color-danger, #e00); margin: 12px 0; }
</style>

<p class="homey-subtitle" data-i18n="pair.intro"></p>

<fieldset class="homey-form-fieldset">
  <legend class="homey-form-legend" data-i18n="pair.found"></legend>
  <div id="found" class="nrg-found"><p class="nrg-muted" data-i18n="pair.searching"></p></div>
</fieldset>

<form id="form" class="homey-form">
  <div class="homey-form-group">
    <label class="homey-form-label" for="host" data-i18n="pair.host"></label>
    <input class="homey-form-input" id="host" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="username" data-i18n="pair.username"></label>
    <input class="homey-form-input" id="username" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="password" data-i18n="pair.password"></label>
    <input class="homey-form-input" id="password" type="password" autocomplete="off" />
    <p class="nrg-muted" data-i18n="pair.credentials_hint"></p>
  </div>
  <p id="error" class="nrg-error" hidden></p>
  <button id="connect" type="submit" class="homey-button-primary-full" data-i18n="pair.connect"></button>
</form>

<script type="application/javascript">
  (function () {
    var form = document.getElementById('form');
    var host = document.getElementById('host');
    var username = document.getElementById('username');
    var password = document.getElementById('password');
    var error = document.getElementById('error');
    var button = document.getElementById('connect');
    var found = document.getElementById('found');

    function showError(message) {
      error.textContent = message || '';
      error.hidden = !message;
    }

    Homey.emit('discover').then(function (list) {
      found.textContent = '';
      if (!list.length) {
        var none = document.createElement('p');
        none.className = 'nrg-muted';
        none.textContent = Homey.__('pair.none_found');
        found.appendChild(none);
        return;
      }
      list.forEach(function (item) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'homey-button-secondary-shadow';
        b.textContent = item.name + ' (' + item.host + ')' + (item.apiEnabled ? '' : ' – ' + Homey.__('pair.api_off'));
        b.addEventListener('click', function () {
          host.value = item.host;
          showError(item.apiEnabled ? '' : Homey.__('errors.api_disabled'));
        });
        found.appendChild(b);
      });
    }).catch(function () {
      found.textContent = '';
    });

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      showError('');
      button.disabled = true;
      button.textContent = Homey.__('pair.connecting');
      Homey.emit('connect', { host: host.value, username: username.value, password: password.value })
        .then(function (device) { return Homey.createDevice(device); })
        .then(function () { Homey.done(); })
        .catch(function (err) {
          showError(err && err.message ? err.message : String(err));
          button.disabled = false;
          button.textContent = Homey.__('pair.connect');
        });
    });
  }());
</script>
